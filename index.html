<html lang="en">

<style>
  :root{
    --black:#050506;
    --panel:rgba(255,255,255,0.035);
    --panel-border:rgba(255,255,255,0.08);

    --gold-soft:#f0d878;
    --violet:#8b6cff;

    --red:#ff4d5e;

    --sub:#8a877e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(139,108,255,0.10), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(212,175,55,0.10), transparent 45%),

    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 18px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  /* header */
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .brand{display:flex;flex-direction:column;gap:4px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
  h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:28px;letter-spacing:1px;
     background:linear-gradient(90deg,var(--gold-soft),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);text-align:right;}

    background:var(--panel);border:1px solid var(--panel-border);border-radius:18px;

    background:radial-gradient(circle,rgba(139,108,255,0.18),transparent 70%);pointer-events:none;

  .hero-left{position:relative;z-index:1;}
  .hero-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--sub);text-transform:uppercase;margin-bottom:6px;}
  .hero-value{font-family:'Orbitron',sans-serif;font-weight:700;font-size:40px;color:var(--text);}
  .hero-pl{font-family:'JetBrains Mono',monospace;font-size:15px;margin-top:8px;}

  .alloc-bar{display:flex;width:100%;height:14px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,0.05);margin-bottom:12px;}

  .wages-field{display:flex;align-items:center;gap:10px;}

  @media(max-width:760px){.tax-grid{grid-template-columns:repeat(2,1fr);}}
  .tax-stat{background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);border-radius:10px;padding:12px 14px;}

  .tax-note{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);margin-top:14px;line-height:1.6;}

  /* cards grid */

  @media(max-width:760px){.grid{grid-template-columns:1fr;} .hero{grid-template-columns:1fr;}}

  .card{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;
    padding:20px 22px;backdrop-filter:blur(16px);position:relative;overflow:hidden;

    content:'';position:absolute;top:0;left:0;width:100%;height:2px;

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .sym{font-family:'Orbitron',sans-serif;font-weight:700;font-size:20px;letter-spacing:.5px;}
  .name{font-family:'Inter',sans-serif;font-size:12px;color:var(--sub);margin-top:2px;}
  .chain-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--violet);
    border:1px solid rgba(139,108,255,0.4);padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:1px;}
  .addr{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);word-break:break-all;margin-top:6px;opacity:.7;}

  .price-row{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px;}
  .price{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:700;}
  .chg{font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 7px;border-radius:6px;}
  .chg.pos{background:rgba(57,255,136,0.12);}
  .chg.neg{background:rgba(255,77,94,0.12);}

  .divider{height:1px;background:var(--panel-border);margin:14px 0;}

  .field-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .field-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;}
  .field-input{
    background:rgba(255,255,255,0.04);border:1px solid var(--panel-border);color:var(--gold-soft);
    font-family:'JetBrains Mono',monospace;font-size:13px;padding:6px 10px;border-radius:8px;
    width:110px;text-align:right;
  }
  .field-input:focus{outline:none;border-color:var(--gold);}

  .stat-row{display:flex;justify-content:space-between;margin-bottom:8px;font-family:'JetBrains Mono',monospace;font-size:13px;}
  .stat-label{color:var(--sub);}
  .stat-val{font-weight:700;}

  .ratio-wrap{display:flex;align-items:center;gap:14px;margin-top:16px;}
  .ratio-ring{position:relative;width:58px;height:58px;flex-shrink:0;}
  .ratio-ring svg{transform:rotate(-90deg);}
  .ratio-ring-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:5;}
  .ratio-ring-fg{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s ease;}
  .ratio-ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;}
  .ratio-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;}
  .ratio-sub{font-size:11px;color:var(--sub);margin-top:2px;}

  .err{color:var(--red);font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 0;}
  .loading{color:var(--sub);font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 0;}

  footer{text-align:center;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);letter-spacing:1px;}
</style>

<div class="wrap">

  <header>
    <div class="brand">

  <div class="hero">
    <div class="hero-left">
      <div class="hero-label">Total Portfolio Value</div>

      <div>
        <div class="hero-label">Tax Impact If Sold Today</div>

      </div>
      <div class="wages-field">
        <span class="field-label">W-2 Income</span>
        <input class="field-input" id="wagesInput" type="number" min="0" step="any" value="59800">
      </div>

  <footer>PRICES VIA GECKOTERMINAL · AUTO-REFRESH 60S · DATA STORED PRIVATELY TO THIS VAULT</footer>

<script>
const TOKENS = [
  { address: "0x249130F5E2dD4CF278180c0dF8273f3592Ad1247", network: "eth" },        // DMT-NAT
  { address: "0x94534EeEe131840b1c0F61847c572228bdfDDE93", network: "pulsechain" }, // PTGC
  { address: "0xF19308F923582A6f7c465e5CE7a9Dc1BEC6665B1", network: "eth" },        // TITANX
  { address: "0xF6f8Db0aBa00007681F8fAF16A0FDa1c9B030b11", network: "pulsechain" }, // PRVX
];

const FALLBACK_NETWORKS = ["pulsechain", "eth", "bsc", "base"];

// ── 2026 TAX ENGINE (single filer, NYC resident) ────────────────────────
// Sources: IRS Rev. Proc. 2025-32 (federal ordinary + LTCG brackets, std deduction),
// NY State FY2026 budget (bottom-bracket rate cut), NYC resident tax schedule.
// NY/NYC bracket thresholds are estimates pending final DTF publication — figures
// here are close but treat as directional, not filing-precision.
const FEDERAL_STD_DEDUCTION_SINGLE = 16100;
const NY_STD_DEDUCTION_SINGLE = 8000;
const NIIT_THRESHOLD_SINGLE = 200000;
const NIIT_RATE = 0.038;

// [incomeThreshold, marginalRate] — cumulative progressive brackets
const FEDERAL_ORDINARY_2026 = [
  [0, 0.10], [12400, 0.12], [50400, 0.22], [105700, 0.24],
  [201775, 0.32], [256225, 0.35], [640600, 0.37]
];
const FEDERAL_LTCG_2026 = [
  [0, 0.00], [49450, 0.15], [545500, 0.20]
];
const NY_STATE_2026 = [
  [0, 0.039], [8500, 0.044], [11700, 0.0515], [13900, 0.054],
  [80650, 0.059], [215400, 0.0685], [1077550, 0.0965],
  [5000000, 0.103], [25000000, 0.109]
];
const NYC_RESIDENT_2026 = [
  [0, 0.03078], [12000, 0.03762], [25000, 0.03819], [50000, 0.03876]
];

function bracketTax(income, brackets){
  if(income <= 0) return 0;
  let tax = 0;
  for(let i=0;i<brackets.length;i++){
    const [threshold, rate] = brackets[i];
    const next = (i+1 < brackets.length) ? brackets[i+1][0] : Infinity;
    if(income > threshold){
      tax += (Math.min(income, next) - threshold) * rate;
    } else break;
  }
  return tax;
}

// Computes tax owed on realizing stGain (ordinary) + ltGain (preferential) on top of wages.
function computeTaxImpact(wages, stGain, ltGain){
  stGain = Math.max(0, stGain);
  ltGain = Math.max(0, ltGain);

  // Federal: ST stacks as ordinary income, LT stacks on top for bracket purposes
  const fedBase = Math.max(0, wages - FEDERAL_STD_DEDUCTION_SINGLE);
  const fedWithST = Math.max(0, wages + stGain - FEDERAL_STD_DEDUCTION_SINGLE);
  const fedTaxOnST = bracketTax(fedWithST, FEDERAL_ORDINARY_2026) - bracketTax(fedBase, FEDERAL_ORDINARY_2026);
  const fedTaxOnLT = bracketTax(fedWithST + ltGain, FEDERAL_LTCG_2026) - bracketTax(fedWithST, FEDERAL_LTCG_2026);
  const federalTotal = fedTaxOnST + fedTaxOnLT;

  // NIIT — 3.8% surtax on lesser of net investment income or MAGI over threshold
  const magi = wages + stGain + ltGain;
  const nii = stGain + ltGain;
  const niit = magi > NIIT_THRESHOLD_SINGLE ? NIIT_RATE * Math.min(nii, magi - NIIT_THRESHOLD_SINGLE) : 0;

  // NY State & NYC — no preferential rate; ST+LT both taxed as ordinary income
  const nyBase = Math.max(0, wages - NY_STD_DEDUCTION_SINGLE);
  const nyWithGains = Math.max(0, wages + stGain + ltGain - NY_STD_DEDUCTION_SINGLE);
  const nyTax = bracketTax(nyWithGains, NY_STATE_2026) - bracketTax(nyBase, NY_STATE_2026);
  const nycTax = bracketTax(nyWithGains, NYC_RESIDENT_2026) - bracketTax(nyBase, NYC_RESIDENT_2026);

  const totalTax = federalTotal + niit + nyTax + nycTax;
  return { fedTaxOnST, fedTaxOnLT, federalTotal, niit, nyTax, nycTax, totalTax };
}

function daysHeld(purchaseDateStr){
  if(!purchaseDateStr) return null;
  const purchase = new Date(purchaseDateStr + "T00:00:00");
  if(isNaN(purchase.getTime())) return null;
  const diffMs = Date.now() - purchase.getTime();
  return Math.floor(diffMs / 86400000);
}


const COLORS = ["#d4af37", "#8b6cff", "#39ff88", "#ff8a5c"];

let state = {}; // address -> { symbol, name, chain, price, chg24, shares, cost }

function fmtUsd(n, decimals){
  if(n === null || n === undefined || isNaN(n)) return "—";
  if(decimals === undefined){
    decimals = n < 1 ? 6 : n < 100 ? 4 : 2;
  }
  return "$" + n.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
function fmtNum(n, decimals=2){
  if(n === null || n === undefined || isNaN(n)) return "—";
  return n.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}

let taxSettings = { wages: 59800 };

function loadPersisted(){
  for(const t of TOKENS){
    const key = "vault-crypto:" + t.address.toLowerCase();
    try{
      const raw = localStorage.getItem(key);
      if(raw){
        const parsed = JSON.parse(raw);
        state[t.address] = { ...state[t.address], shares: parsed.shares ?? 0, cost: parsed.cost ?? 0, purchaseDate: parsed.purchaseDate ?? "" };
      } else {
        state[t.address] = { ...state[t.address], shares: 0, cost: 0, purchaseDate: "" };
      }
    }catch(e){
      state[t.address] = { ...state[t.address], shares: 0, cost: 0, purchaseDate: "" };
    }
  }
  try{
    const raw = localStorage.getItem("vault-tax-settings");
    if(raw) taxSettings = { ...taxSettings, ...JSON.parse(raw) };
  }catch(e){}
}

function persist(address){
  const key = "vault-crypto:" + address.toLowerCase();
  const s = state[address];
  try{
    localStorage.setItem(key, JSON.stringify({ shares: s.shares, cost: s.cost, purchaseDate: s.purchaseDate }));
  }catch(e){ console.error("storage save failed", e); }
}

function persistTaxSettings(){
  try{
    localStorage.setItem("vault-tax-settings", JSON.stringify(taxSettings));
  }catch(e){ console.error("storage save failed", e); }
}

async function fetchPoolsOnNetwork(network, address){
  const url = `https://api.geckoterminal.com/api/v2/networks/${network}/tokens/${address}/pools?page=1&include=base_token,quote_token`;
  const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if(resp.status === 429){
    throw new Error("rate limited (429) — wait a moment and refresh again");
  }
  if(!resp.ok){
    throw new Error(`HTTP ${resp.status}`);
  }
  const json = await resp.json();
  if(!json.data || json.data.length === 0) return null;

  // pick pool with highest reserve (liquidity)
  let best = json.data[0];
  let bestLiq = parseFloat(best.attributes.reserve_in_usd) || 0;
  for(const p of json.data){
    const liq = parseFloat(p.attributes.reserve_in_usd) || 0;
    if(liq > bestLiq){ best = p; bestLiq = liq; }
  }

  const targetId = `${network}_${address.toLowerCase()}`;
  const baseId = best.relationships?.base_token?.data?.id;
  const quoteId = best.relationships?.quote_token?.data?.id;

  let priceUsd, tokenRefId;
  if(baseId && baseId.toLowerCase() === targetId){
    priceUsd = parseFloat(best.attributes.base_token_price_usd);
    tokenRefId = baseId;
  } else if(quoteId && quoteId.toLowerCase() === targetId){
    priceUsd = parseFloat(best.attributes.quote_token_price_usd);
    tokenRefId = quoteId;
  } else {
    // fallback: assume base
    priceUsd = parseFloat(best.attributes.base_token_price_usd);
    tokenRefId = baseId;
  }

  let symbol = null, name = null;
  if(json.included){
    const tok = json.included.find(t => t.id === tokenRefId);
    if(tok){ symbol = tok.attributes.symbol; name = tok.attributes.name; }
  }

  const chg24raw = best.attributes.price_change_percentage?.h24;
  const chg24 = chg24raw !== undefined && chg24raw !== null ? parseFloat(chg24raw) : null;

  if(isNaN(priceUsd)) return null;

  return { symbol, name, chain: network, price: priceUsd, chg24 };
}

async function fetchPrice(token){
  try{
    const result = await fetchPoolsOnNetwork(token.network, token.address);
    return result;
  }catch(e){
    console.error("price fetch failed for", token.address, e);
    return { error: true, errorMsg: e.message || "fetch failed" };
  }
}

async function refreshAll(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = "⟳ SYNCING...";

  for(const t of TOKENS){
    const d = await fetchPrice(t);
    if(d && d.error){
      state[t.address] = { ...state[t.address], error:true, errorMsg: d.errorMsg };
    } else if(d){
      state[t.address] = { ...state[t.address], ...d, error:false, errorMsg:null };
    } else {
      state[t.address] = { ...state[t.address], error:true, errorMsg:"no pool found on " + t.network };
    }
    render();
    await new Promise(r => setTimeout(r, 600)); // stagger to respect ~10-30 calls/min limit
  }
  document.getElementById('lastUpdated').textContent = "updated " + new Date().toLocaleTimeString();
  btn.disabled = false; btn.textContent = "⟳ REFRESH PRICES";
}

function updateField(address, field, value){
  if(field === 'purchaseDate'){
    state[address][field] = value;
  } else {
    const num = parseFloat(value);
    state[address][field] = isNaN(num) ? 0 : num;
  }
  persist(address);
  // don't call render() here — the input the user is actively typing in
  // would get destroyed and rebuilt mid-keystroke. Totals/ratios/allocation
  // catch up on the next price refresh or when the field loses focus.
}

function onFieldBlur(address, field, value){
  updateField(address, field, value);
  render(); // now safe to rebuild — the field is no longer focused
}

function updateWages(value){
  const num = parseFloat(value);
  taxSettings.wages = isNaN(num) ? 0 : num;
  persistTaxSettings();
}

function onWagesBlur(value){
  updateWages(value);
  render();
}

function render(){
  const grid = document.getElementById('cardGrid');

  // capture focus state so an auto-refresh mid-typing doesn't steal the cursor
  const activeEl = document.activeElement;
  let focusRestore = null;
  if(activeEl && activeEl.classList && activeEl.classList.contains('field-input')){
    focusRestore = {
      address: activeEl.dataset.address,
      field: activeEl.dataset.field,
      selStart: activeEl.selectionStart,
      selEnd: activeEl.selectionEnd
    };
  }

  grid.innerHTML = "";

  // compute total value
  let totalValue = 0, totalCost = 0;
  TOKENS.forEach(t => {
    const s = state[t.address];
    if(s && s.price && s.shares){
      totalValue += s.price * s.shares;
      totalCost += (s.cost || 0) * s.shares;
    }
  });

  document.getElementById('totalValue').textContent = fmtUsd(totalValue, 2);
  const plEl = document.getElementById('totalPL');
  if(totalCost > 0){
    const pl = totalValue - totalCost;
    const plPct = (pl/totalCost)*100;
    plEl.innerHTML = `<span class="${pl>=0?'pos':'neg'}">${pl>=0?'▲':'▼'} ${fmtUsd(Math.abs(pl),2)} (${plPct>=0?'+':''}${fmtNum(plPct,2)}%)</span> <span class="neu">unrealized</span>`;
  } else {
    plEl.innerHTML = `<span class="neu">add cost basis to track P&L</span>`;
  }

  // ── aggregate ST/LT gains across all assets for the combined tax card ──
  let totalSTGain = 0, totalLTGain = 0, anyGainData = false;
  TOKENS.forEach(t => {
    const s = state[t.address];
    if(!s || !s.price || !s.shares || !s.cost) return;
    const gain = (s.price - s.cost) * s.shares;
    if(gain <= 0) return; // only taxable gains matter for this estimate
    const held = daysHeld(s.purchaseDate);
    if(held === null) return; // no purchase date entered — can't classify
    anyGainData = true;
    if(held > 365) totalLTGain += gain; else totalSTGain += gain;
  });

  const taxBody = document.getElementById('taxBody');
  if(!anyGainData){
    taxBody.innerHTML = `<div class="loading">Add a purchase date and cost basis to each holding to estimate what you'd owe on a sale.</div>`;
  } else {
    const impact = computeTaxImpact(taxSettings.wages, totalSTGain, totalLTGain);
    const totalGain = totalSTGain + totalLTGain;
    const netAfterTax = totalGain - impact.totalTax;
    const effRate = totalGain > 0 ? (impact.totalTax/totalGain)*100 : 0;

    taxBody.innerHTML = `
      <div class="tax-grid">
        <div class="tax-stat">
          <div class="tax-stat-label">Short-Term Gain</div>
          <div class="tax-stat-val">${fmtUsd(totalSTGain,2)}</div>
        </div>
        <div class="tax-stat">
          <div class="tax-stat-label">Long-Term Gain</div>
          <div class="tax-stat-val">${fmtUsd(totalLTGain,2)}</div>
        </div>
        <div class="tax-stat">
          <div class="tax-stat-label">Federal (ordinary + LTCG)</div>
          <div class="tax-stat-val">${fmtUsd(impact.federalTotal,2)}</div>
        </div>
        <div class="tax-stat">
          <div class="tax-stat-label">NY State + NYC</div>
          <div class="tax-stat-val">${fmtUsd(impact.nyTax + impact.nycTax,2)}</div>
        </div>
      </div>
      ${impact.niit > 0 ? `<div class="tax-stat" style="margin-bottom:16px;"><div class="tax-stat-label">NIIT Surtax (3.8%, MAGI over $200K)</div><div class="tax-stat-val">${fmtUsd(impact.niit,2)}</div></div>` : ''}
      <div class="tax-total-row">
        <div>
          <div class="tax-total-label">Estimated Total Tax Owed</div>
          <div class="tax-total-val">${fmtUsd(impact.totalTax,2)}</div>
        </div>
        <div style="text-align:right;">
          <div class="tax-total-label">Net After Tax (${fmtNum(effRate,1)}% effective)</div>
          <div class="tax-net-val">${fmtUsd(netAfterTax,2)}</div>
        </div>
      </div>
      <div class="tax-note">Stacks on top of your $${taxSettings.wages.toLocaleString()} W-2 income · single filer, NYC resident, 2026 brackets · long-term = held over 365 days · NY/NYC tax gains as ordinary income (no preferential rate) · estimate only, not tax advice — confirm with a CPA before filing.</div>
    `;
  }

  // allocation bar + legend
  const allocBar = document.getElementById('allocBar');
  const allocLegend = document.getElementById('allocLegend');
  allocBar.innerHTML = ""; allocLegend.innerHTML = "";

  TOKENS.forEach((t, i) => {
    const s = state[t.address];
    const value = (s && s.price && s.shares) ? s.price*s.shares : 0;
    const pct = totalValue > 0 ? (value/totalValue)*100 : 0;

    const seg = document.createElement('div');
    seg.className = 'alloc-seg';
    seg.style.width = pct + "%";
    seg.style.background = COLORS[i % COLORS.length];
    allocBar.appendChild(seg);

    const row = document.createElement('div');
    row.className = 'alloc-row';
    row.innerHTML = `
      <span class="alloc-name"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${s?.symbol || t.address.slice(0,6)+'…'}</span>
      <span class="alloc-pct">${fmtNum(pct,1)}%</span>
    `;
    allocLegend.appendChild(row);
  });

  // cards
  TOKENS.forEach((t, i) => {
    const s = state[t.address] || {};
    const card = document.createElement('div');
    card.className = 'card';

    const hasPrice = !!s.price;
    const value = (s.price && s.shares) ? s.price*s.shares : 0;
    const cost = (s.cost && s.shares) ? s.cost*s.shares : 0;
    const pl = value - cost;
    const plPct = cost > 0 ? (pl/cost)*100 : null;
    const pct = totalValue > 0 ? (value/totalValue)*100 : 0;
    const circumference = 2*Math.PI*24;
    const offset = circumference - (pct/100)*circumference;
    const chg = s.chg24;

    const held = daysHeld(s.purchaseDate);
    let badgeHtml = `<span class="holding-badge unknown">Add purchase date</span>`;
    let cardTaxHtml = '';
    if(held !== null){
      const isLT = held > 365;
      badgeHtml = `<span class="holding-badge ${isLT?'lt':'st'}">${isLT?'Long-Term':'Short-Term'} · ${held}d held</span>`;
      if(hasPrice && s.shares && s.cost && pl > 0){
        const single = computeTaxImpact(taxSettings.wages, isLT?0:pl, isLT?pl:0);
        const net = pl - single.totalTax;
        cardTaxHtml = `
          <div class="stat-row"><span class="stat-label">Est. Tax If Sold Today</span><span class="stat-val neg">${fmtUsd(single.totalTax,2)}</span></div>
          <div class="stat-row"><span class="stat-label">Net After Tax</span><span class="stat-val pos">${fmtUsd(net,2)}</span></div>
        `;
      }
    }

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="sym">${s.symbol || 'UNKNOWN'}</div>
          <div class="name">${s.name || (hasPrice ? '' : 'Price unavailable')}</div>
        </div>
        <div class="chain-tag">${s.chain || t.network}</div>
      </div>
      <div class="addr">${t.address}</div>

      ${s.error ? `<div class="err" style="margin-top:10px;">⚠ ${s.errorMsg || "Couldn't find a live pool for this address."}</div>` : ''}

      <div class="price-row">
        <div class="price">${hasPrice ? fmtUsd(s.price) : '···'}</div>
        ${chg !== null && chg !== undefined ? `<div class="chg ${chg>=0?'pos':'neg'}">${chg>=0?'+':''}${fmtNum(chg,2)}% 24h</div>` : ''}
      </div>
      ${badgeHtml}

      <div class="divider"></div>

      <div class="field-row">
        <span class="field-label">Shares Held</span>
        <input class="field-input" type="number" min="0" step="any" value="${s.shares || 0}" data-address="${t.address}" data-field="shares">
      </div>
      <div class="field-row">
        <span class="field-label">Avg Cost / Share</span>
        <input class="field-input" type="number" min="0" step="any" value="${s.cost || 0}" data-address="${t.address}" data-field="cost">
      </div>
      <div class="field-row">
        <span class="field-label">Purchase Date</span>
        <input class="field-input" type="date" value="${s.purchaseDate || ''}" data-address="${t.address}" data-field="purchaseDate" style="width:140px;">
      </div>

      <div class="divider"></div>

      <div class="stat-row"><span class="stat-label">Market Value</span><span class="stat-val">${hasPrice ? fmtUsd(value,2) : '—'}</span></div>
      <div class="stat-row"><span class="stat-label">Cost Basis</span><span class="stat-val">${cost>0?fmtUsd(cost,2):'—'}</span></div>
      <div class="stat-row">
        <span class="stat-label">P&L</span>
        <span class="stat-val ${plPct===null?'neu':(pl>=0?'pos':'neg')}">
          ${(!hasPrice || plPct===null) ? '—' : `${pl>=0?'+':''}${fmtUsd(pl,2)} (${plPct>=0?'+':''}${fmtNum(plPct,2)}%)`}
        </span>
      </div>
      ${cardTaxHtml}

      <div class="ratio-wrap">
        <div class="ratio-ring">
          <svg width="58" height="58">
            <circle class="ratio-ring-bg" cx="29" cy="29" r="24"></circle>
            <circle class="ratio-ring-fg" cx="29" cy="29" r="24"
              stroke="${COLORS[i%COLORS.length]}"
              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="ratio-ring-txt">${fmtNum(pct,0)}%</div>
        </div>
        <div>
          <div class="ratio-label">Portfolio Ratio</div>
          <div class="ratio-sub">${fmtNum(pct,2)}% of total vault value</div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  // wire up inputs
  grid.querySelectorAll('.field-input').forEach(inp => {
    inp.addEventListener('input', (e) => {
      updateField(e.target.dataset.address, e.target.dataset.field, e.target.value);
    });
    inp.addEventListener('blur', (e) => {
      onFieldBlur(e.target.dataset.address, e.target.dataset.field, e.target.value);
    });
  });

  // restore focus/cursor if a refresh happened mid-typing
  if(focusRestore){
    const sel = `.field-input[data-address="${focusRestore.address}"][data-field="${focusRestore.field}"]`;
    const newInput = grid.querySelector(sel);
    if(newInput){
      newInput.focus();
      try{ newInput.setSelectionRange(focusRestore.selStart, focusRestore.selEnd); }catch(e){}
    }
  }
}

async function init(){
  await loadPersisted();
  const wagesInput = document.getElementById('wagesInput');
  wagesInput.value = taxSettings.wages;
  wagesInput.addEventListener('input', (e) => updateWages(e.target.value));
  wagesInput.addEventListener('blur', (e) => onWagesBlur(e.target.value));
  render();
  await refreshAll();
  setInterval(refreshAll, 60000);
}

document.getElementById('refreshBtn').addEventListener('click', refreshAll);
init();
</script>
</body>
</html>
